<p-button
  icon="pi pi-user"
  [rounded]="true"
  severity="info"
  (click)="showDialog()"
/>
<p-dialog
  header="Configurações de usuário"
  [(visible)]="visible"
  [modal]="true"
  [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }"
  [style]="{ width: '50vw', height: '80vh' }"
  [dismissableMask]="true"
  [draggable]="false"
  [resizable]="false"
>
  <div style="display: flex; flex-direction: column; gap: 1.5rem">
    <div id="delete-user" style="display: flex; align-items: center; gap: 1rem">
      <div style="flex-grow: 1;">
        <p-inputgroup>
          <p-inputgroup-addon>
            <i class="pi pi-user"></i>
          </p-inputgroup-addon>
          <input pInputText type="text" [(ngModel)]="deleteUser" placeholder="Usuário a deletar" />
        </p-inputgroup>
      </div>
      <p-button
        label="Deletar usuário"
        (click)="deleteUserClick()"
        severity="primary"
      />
    </div>
    <form [formGroup]="formGroup" class="card flex justify-center">
      <p-multiselect
        [options]="disciplines"
        formControlName="disciplines"
        optionLabel="name"
        placeholder="Selecione as disciplinas concluídas"
        [maxSelectedLabels]="3"
        class="w-full"
        styleClass="h-full"
        size="large"
        scrollHeight="40vh"
        [panelStyle]="{ width: '400px' }"
      ></p-multiselect>
    </form>
    <div id="update-semester" style="display: flex; align-items: center; gap: 1rem">
      <div style="flex-grow: 1;">
        <input pInputText type="number" [(ngModel)]="semester" placeholder="Período" />
      </div>
    </div>
  </div>
  <ng-template pTemplate="footer">
    <p-button
      label="Salvar"
      [disabled]="formGroup.invalid"
      (click)="submitChanges()"
      severity="primary"
    />
  </ng-template>
</p-dialog>
