<p-button
  icon="pi pi-sitemap"
  (click)="showDialog()"
  [rounded]="true"
  severity="secondary"
></p-button>

<p-dialog
  [(visible)]="visible"
  [modal]="true"
  [closable]="true"
  [dismissableMask]="true"
  [style]="{ width: '60rem' }"
>
  <ng-template pTemplate="header">
    <h2 class="text-lg font-semibold">Ordenação Topológica</h2>
  </ng-template>

  <form [formGroup]="formGroup" class="flex flex-col gap-4 mb-4">
    <label for="maxDisciplinas">Número máximo de disciplinas:</label>
    <input
      id="maxDisciplinas"
      type="number"
      pInputText
      formControlName="max"
      min="1"
      (change)="atualizarOrdenacao()"
    />
  </form>

  <p-dataview #dv [value]="disciplinas()">
    <ng-template #list let-items>
      <div class="grid grid-cols-12 gap-4 grid-nogutter">
        <div
          class="col-span-12"
          *ngFor="let item of items; let first = first"
          class="col-span-12"
        >
          <div
            class="flex flex-col sm:flex-row sm:items-center p-6 gap-4"
            [ngClass]="{
              'border-t border-surface-200 dark:border-surface-700': !first
            }"
          >
            <div class="md:w-40 relative">
              <div
                class="md:w-40 flex items-center justify-center text-xl font-bold bg-primary text-white rounded-border h-32"
              >
                {{ item.codigo }}
              </div>
              <p-tag
                [value]="item.inventoryStatus"
                class="absolute"
                styleClass="dark:!bg-surface-900"
                [style.left.px]="4"
                [style.top.px]="4"
              />
            </div>
            <div
              class="flex flex-col md:flex-row justify-between md:items-center flex-1 gap-6"
            >
              <div
                class="flex flex-row md:flex-col justify-between items-start gap-2"
              >
                <div>
                  <span class="font-medium text-secondary text-sm">{{
                    item.category
                  }}</span>
                  <div
                    class="text-lg font-medium text-surface-900 dark:text-surface-0 mt-2"
                  >
                    {{ item.name }}
                  </div>
                </div>
              </div>
              <div class="flex flex-col md:items-end gap-8">
                <span
                  class="text-xl font-semibold text-surface-900 dark:text-surface-0"
                  >{{ item.nome }}</span
                >
              </div>
              <div class="flex flex-col md:items-end gap-4">
                <span
                  class="text-surface-900 dark:text-surface-0 text-sm font-medium"
                >
                  Período: {{ item.periodo }}</span
                >
                <span
                  class="text-surface-900 dark:text-surface-0 text-sm font-medium"
                >
                  CHS: {{ item.carga_horaria }}</span
                >
                <div
                  class="bg-surface-100 dark:bg-surface-700 p-1 rounded-full"
                >
                  <div
                    class="bg-surface-0 dark:bg-surface-900 flex items-center gap-2 py-1 px-2 rounded-full shadow-sm"
                  >
                    <span
                      class="text-surface-900 dark:text-surface-0 text-sm font-medium"
                    >
                      Cadeia: {{ item.comprimento_cadeia }}
                    </span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </ng-template>
  </p-dataview>
</p-dialog>
